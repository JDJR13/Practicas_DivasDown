# Aislamiento extra de control_daemon (se instala como drop-in con scripts/blindar.sh; se quita con: blindar.sh --quitar-aislamiento)
[Service]
ProtectSystem=strict
ReadWritePaths=/tmp
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0027
