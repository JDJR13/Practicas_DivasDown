# Aislamiento extra de vision_gui: todo el sistema de solo lectura salvo /tmp (fotos en RAM) y la carpeta de tiras
[Service]
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/tmp __HOME__/fotobut_sesiones
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0027
