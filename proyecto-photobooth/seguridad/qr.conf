# Aislamiento extra de qr_httpd, el unico proceso que habla con la red: sin dispositivos, sin capacidades, con topes de
# memoria y de hilos. Aunque un atacante lograra ejecutar codigo aqui, no ve el hardware ni puede escribir en disco.
[Service]
PrivateDevices=yes
PrivateTmp=no
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
MemoryMax=200M
TasksMax=96
UMask=0077
