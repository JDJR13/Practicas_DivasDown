# Configuracion de El Fotobut (Clase 22: los valores que cambia quien instala la cabina, sin tocar el codigo).
# Formato: clave = valor. Lo que no aparezca aqui toma su valor por omision de fotobut/servicios/config.py.
# Se aplica al reiniciar los servicios:  sudo systemctl restart 'fotobut-*'
# Para una cabina concreta tambien puede copiarse a /etc/fotobut/fotobut.conf (tiene prioridad sobre este).

# --- Red Wi-Fi propia de la cabina (despues de cambiarla:  sudo ./scripts/setup_ap.sh) ---
wifi_ssid = Fotobut
wifi_pass = fotobut2026          # WPA2: minimo 8 caracteres; sin el simbolo # (inicia un comentario)

# --- Presencia (HC-SR04 por el STM32) ---
presence_min_cm = 30             # mas cerca que esto no cuenta como persona (pared, caja)
presence_max_cm = 120            # mas lejos tampoco
presence_samples = 5             # lecturas seguidas (a 10 Hz) para despertar: 5 = medio segundo

# --- Tiempos (segundos) ---
no_presence_s = 5                # sin nadie enfrente -> pantalla de reposo
result_timeout_s = 45            # cuanto se queda la tira con sus QR en pantalla
count_from = 3                   # cuenta regresiva 3-2-1
share_ttl_s = 21600              # 6 h: despues el enlace de descarga deja de funcionar

# --- Buzzer (frecuencias en Hz; la mejor se busca con tools/medicion/buzzer_sweep.py) ---
tick_hz = 2700
shutter_hz = 3400

# --- Botones (numeros GPIO, no de pin fisico) ---
gpio_button = 17                 # rojo, pin 11
gpio_reset = 27                  # azul, pin 13
button_active_low = si           # si = el boton une el pin con GND (pull-up interna)
