<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantenimiento · El Fotobut</title>
<style>
:root{--deep:#0b2e22;--green:#15503b;--mint:#8EE3B0;--cream:#FFF6E3;--orange:#FF6A3D;--yellow:#FFD166;--red:#ff8a7a;--line:rgba(255,246,227,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--deep);color:var(--cream);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px 16px 48px}
main{max-width:980px;margin:0 auto}h1{font-size:24px;margin:0}header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header small{color:var(--mint)}h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);margin:26px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.box{background:rgba(255,246,227,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box b{display:block;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.box span{font-size:12.5px;opacity:.75}
.srv{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--mint)}.dot.mal{background:var(--red)}.dot.na{background:#777}
button,a.btn{font:inherit;font-weight:600;color:var(--deep);background:var(--cream);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{background:#fff}button:focus-visible,a.btn:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button.sec{background:transparent;color:var(--cream);border:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}li.ev{display:grid;grid-template-columns:150px 62px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
li.ev time{opacity:.7;font-variant-numeric:tabular-nums}.WARN{color:var(--yellow)}.ERROR{color:var(--red)}.INFO{color:var(--mint)}
pre{background:#071d16;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:420px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
select{font:inherit;background:var(--deep);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
svg{width:100%;height:70px;display:block}#msg{min-height:1.4em;color:var(--yellow)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
@media(max-width:560px){li.ev{grid-template-columns:1fr;gap:2px}}
</style></head><body><main>
<header><h1>El Fotobut · mantenimiento</h1><small id="ahora">conectando…</small></header>
<p id="msg" role="status"></p>
<h2>Cabina</h2><div class="grid" id="cab"></div>
<h2>Servicios</h2><div class="grid" id="srv" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"></div>
<h2>Última hora · temperatura del CPU (°C) y RAM usada (MB)</h2><div class="box"><svg id="g" viewBox="0 0 600 70" preserveAspectRatio="none"></svg><span id="gl"></span></div>
<h2>Eventos (caja negra)</h2><ul id="ev"></ul>
<h2>Registros de systemd</h2>
<div class="row"><select id="sel" aria-label="Servicio"><option value="todos">los 3 servicios</option><option value="control">control_daemon</option><option value="vision">vision_gui</option><option value="qr">qr_httpd</option><option value="monitor">monitor</option></select>
<button class="sec" id="ver">Actualizar registros</button><a class="btn" href="/respaldo.tar.gz">Descargar respaldo</a></div>
<pre id="log">Elige un servicio y pulsa «Actualizar registros».</pre>
</main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??"—").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NOM={control:"control_daemon · hardware",vision:"vision_gui · cámara y pantalla",qr:"qr_httpd · descargas"};
function caja(v,t){return `<div class="box"><b>${esc(v)}</b><span>${esc(t)}</span></div>`}
function dur(s){if(s==null)return "—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${m} min`:`${m} min`}
async function carga(){
  let d;try{d=await (await fetch("/api/resumen")).json()}catch(e){$("#ahora").textContent="sin conexión con el monitor";return}
  const m=d.muestra||{};$("#ahora").textContent="Actualizado "+d.ahora;
  $("#cab").innerHTML=[caja(m.vision_ok?m.estado:"sin respuesta","estado de la pantalla"),caja(m.sesiones??"—","sesiones desde el arranque"),
    caja(m.cpu_c!=null?m.cpu_c+" °C":"—","CPU"),caja(m.temp_c!=null?m.temp_c.toFixed(1)+" °C":"—","caja (BMP280)"),
    caja(m.ram_mb!=null?m.ram_mb+" MB":"—",m.ram_total_mb?"RAM usada de "+m.ram_total_mb+" MB":"RAM usada"),caja(m.disco_libre_mb!=null?m.disco_libre_mb+" MB":"—","libres en la microSD"),
    caja(m.stm32?"con tramas":"sin tramas","STM32 (distancia)"),caja(m.camara?"lista":m.sim?"simulada":"sin cámara","cámara"),
    caja(m.voltaje==null?"—":(m.voltaje&1?"BAJO":m.voltaje?"hubo caídas":"correcto"),"voltaje"),caja(dur(m.encendida_s),"encendida")].join("");
  const s=m.srv||{};
  $("#srv").innerHTML=Object.keys(NOM).map(k=>{const x=s[k];const ok=x&&x.activo==="active";
    return `<div class="box srv"><div><span class="dot ${x?(ok?"":"mal"):"na"}"></span><strong>${NOM[k]}</strong><br><span>${x?esc(x.activo)+" · PID "+x.pid+" · "+x.reinicios+" reinicios":"sin datos de systemd"}</span></div>
    <button data-s="${k}" ${x?"":"disabled"}>Reiniciar</button></div>`}).join("");
  $("#ev").innerHTML=(d.eventos||[]).map(e=>`<li class="ev"><time>${esc(e.h)}</time><b class="${esc(e.nivel)}">${esc(e.nivel)}</b><span>${esc(e.txt)}</span></li>`).join("")||"<li>Sin eventos todavía.</li>";
  const se=d.serie||[];const linea=(k,c)=>{const v=se.map(r=>r[k]).filter(x=>x!=null);if(v.length<2)return "";const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1;
    return `<polyline fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" points="${v.map((y,i)=>`${(i/(v.length-1)*600).toFixed(1)},${(64-(y-lo)/r*58).toFixed(1)}`).join(" ")}"/>`};
  $("#g").innerHTML=linea("cpu_c","#FF6A3D")+linea("ram_mb","#8EE3B0");
  const cv=se.map(r=>r.cpu_c).filter(x=>x!=null),rv=se.map(r=>r.ram_mb).filter(x=>x!=null);
  const rango=(v,u)=>v.length?`${Math.min(...v)}–${Math.max(...v)} ${u}`:"sin dato";
  $("#gl").textContent=se.length?`CPU (naranja): ${rango(cv,"°C")} · RAM (verde): ${rango(rv,"MB")} · ${se.length} muestras`:"Aún no hay muestras.";
}
document.addEventListener("click",async e=>{const s=e.target.dataset&&e.target.dataset.s;if(!s)return;
  if(!confirm("¿Reiniciar "+NOM[s]+"? La cabina se recupera sola en unos 2 segundos."))return;
  const r=await fetch("/api/reiniciar",{method:"POST",headers:{"Content-Type":"application/json","X-Fotobut":"panel"},body:JSON.stringify({servicio:s})});
  const j=await r.json().catch(()=>({msg:"error"}));$("#msg").textContent=(j.ok?"Hecho: ":"No se pudo: ")+j.msg;setTimeout(carga,2500)});
$("#ver").onclick=async()=>{$("#log").textContent="cargando…";$("#log").textContent=await (await fetch("/api/registro?n=300&servicio="+$("#sel").value)).text()};
carga();setInterval(carga,5000);
</script></body></html>
